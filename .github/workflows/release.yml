name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for xcode_path in \
            "/Applications/Xcode_16.2.app" \
            "/Applications/Xcode_16.1.app" \
            "/Applications/Xcode_16.0.app" \
            "/Applications/Xcode_16.app" \
            "/Applications/Xcode.app"; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcrun actool --version || true
          clang --version

      - name: Extract Tag or Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.1.3-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Application Bundle
        run: |
          make clean
          make

      - name: Package DMG Disk Image
        run: |
          export CI=true
          ./scripts/package_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevotionRekindled-${{ steps.get_version.outputs.version }}-macOS
          path: "*.dmg"
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          name: "DevotionRekindled v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
